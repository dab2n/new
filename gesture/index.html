<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Interactive</title>

  <!-- Pretendard font -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />

  <!--
    MediaPipe Gesture Recognizer (vision_bundle)
    버전 업데이트 시 아래 @x.x.x 태그만 변경하세요.
    Docs: https://developers.google.com/mediapipe/solutions/vision/gesture_recognizer
  -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    crossorigin="anonymous"
  ></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text-primary: #191919;
      --text-secondary: #888888;
      --accent: #3182f6;
      --overlay-bg: rgba(0, 0, 0, 0.32);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
    }

    /* ── Full-screen background images ── */
    /*
      두 이미지를 같은 위치에 겹쳐 쌓습니다.
      - #media-default : 항상 보임 (z-index 1)
      - #media-thumb   : Thumb_Up 감지 시에만 opacity 1 (z-index 2)
      검정 배경이 비치지 않도록 src 교체 없이 레이어 전환만 사용합니다.

      SWAP GUIDE (image → video)
      각 <img>를 <video autoplay loop muted playsinline>로 교체하고
      ASSETS 경로를 .mp4로 변경하세요. CSS는 수정 불필요합니다.
    */
    #media-default,
    #media-thumb {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #media-default {
      z-index: 1;
    }

    #media-thumb {
      z-index: 2;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #media-thumb.visible {
      opacity: 1;
    }

    /* ── Top overlay bar ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 100%);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    /* ── Status badge — bottom-left ── */
    .status-wrap {
      position: fixed;
      bottom: 32px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .status-dot.hand  { background: #f5a623; }
    .status-dot.thumb { background: #1ac472; }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      transition: color 0.3s;
    }

    .status-text.hand  { color: #f5a623; }
    .status-text.thumb { color: #1ac472; }

    /* ── Start button — bottom-left above status ── */
    #start-btn {
      position: fixed;
      bottom: 68px;
      left: 28px;
      height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      z-index: 10;
    }

    #start-btn:hover  { opacity: 0.88; }
    #start-btn:active { opacity: 0.72; }
    #start-btn:disabled {
      background: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.5);
      cursor: default;
      opacity: 1;
    }

    /* ── Webcam preview — bottom-right ── */
    #webcam-wrap {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 240px;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(255,255,255,0.18);
      background: #000;
      display: none; /* shown after camera starts */
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror */
      display: block;
    }

    /* ── Error message ── */
    #error-msg {
      position: fixed;
      bottom: 120px;
      left: 28px;
      font-size: 13px;
      color: #ff6b6b;
      display: none;
      z-index: 10;
      max-width: 300px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gesture Interactive</h1>
  </header>

  <!-- 기본 이미지: 항상 화면에 표시 -->
  <img id="media-default" src="default-image.jpg" alt="default visual" />

  <!-- 엄지 이미지: Thumb_Up 감지 시 위로 fade-in -->
  <img id="media-thumb" src="thumb-up-image.png" alt="thumb up visual" />

  <button id="start-btn">Start Camera</button>

  <div class="status-wrap">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Waiting</span>
  </div>

  <p id="error-msg"></p>

  <!-- Webcam preview (bottom-right) -->
  <div id="webcam-wrap">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const startBtn     = document.getElementById("start-btn");
    const webcamEl     = document.getElementById("webcam");
    const webcamWrap   = document.getElementById("webcam-wrap");
    const mediaThumb   = document.getElementById("media-thumb");
    const statusDot    = document.getElementById("status-dot");
    const statusText   = document.getElementById("status-text");
    const errorMsg     = document.getElementById("error-msg");

    // ── Asset paths ───────────────────────────────────────────────────────────
    /*
      SWAP GUIDE (images → videos)
      경로를 .mp4로 변경하고 <img>를 <video>로 교체하세요.
    */
    const ASSETS = {
      default: "default-image.jpg",
      thumbUp: "thumb-up-image.png",
    };

    // ── State ─────────────────────────────────────────────────────────────────
    let recognizer = null;
    let lastState  = "waiting"; // "waiting" | "hand" | "thumb"

    // ── UI helpers ────────────────────────────────────────────────────────────
    function setStatus(state) {
      if (state === lastState) return;
      lastState = state;

      const labels = {
        waiting: "Waiting",
        hand:    "Hand detected",
        thumb:   "Thumb up detected",
      };

      statusText.textContent = labels[state];
      statusDot.className  = "status-dot"  + (state !== "waiting" ? ` ${state}` : "");
      statusText.className = "status-text" + (state !== "waiting" ? ` ${state}` : "");

      // 엄지 레이어만 fade — 기본 이미지는 항상 유지되어 검정 깜빡임 없음
      mediaThumb.classList.toggle("visible", state === "thumb");
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }

    // ── MediaPipe setup ───────────────────────────────────────────────────────
    async function initRecognizer() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      recognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: 1,
      });
    }

    // ── Detection loop ────────────────────────────────────────────────────────
    function detect() {
      if (!recognizer || webcamEl.readyState < 2) {
        requestAnimationFrame(detect);
        return;
      }

      const result = recognizer.recognizeForVideo(webcamEl, performance.now());

      if (!result.gestures || result.gestures.length === 0) {
        setStatus("waiting");
      } else {
        const top = result.gestures[0][0]?.categoryName ?? "";
        setStatus(top === "Thumb_Up" ? "thumb" : "hand");
      }

      requestAnimationFrame(detect);
    }

    // ── Camera start ──────────────────────────────────────────────────────────
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Starting...";

      try {
        if (!recognizer) await initRecognizer();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 },
        });
        webcamEl.srcObject = stream;
        await webcamEl.play();

        webcamWrap.style.display = "block";
        startBtn.textContent = "Camera On";
        detect();

      } catch (err) {
        startBtn.disabled = false;
        startBtn.textContent = "Start Camera";
        if (err.name === "NotAllowedError") {
          showError("카메라 권한이 필요합니다. 브라우저 설정에서 허용해 주세요.");
        } else {
          showError("카메라를 시작할 수 없습니다: " + err.message);
        }
      }
    });
  </script>
</body>
</html>
