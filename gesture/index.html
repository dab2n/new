<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Interactive</title>

  <!-- Pretendard font -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
  />

  <!--
    MediaPipe Gesture Recognizer (vision_bundle)
    To update the model version, change the @x.x.x tag below.
    Docs: https://developers.google.com/mediapipe/solutions/vision/gesture_recognizer
  -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    crossorigin="anonymous"
  ></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f8f8f8;
      --surface: #ffffff;
      --border: #e8e8e8;
      --text-primary: #191919;
      --text-secondary: #888888;
      --accent: #3182f6;
      --radius: 16px;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ── Main card ── */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 80px 24px 120px;
      width: 100%;
      max-width: 480px;
    }

    /* ── Status badge ── */
    .status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
      flex-shrink: 0;
    }

    .status-dot.hand    { background: #f5a623; }
    .status-dot.thumb   { background: #1ac472; }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .status-text.hand   { color: #f5a623; }
    .status-text.thumb  { color: #1ac472; }

    /* ── Image / video container ── */
    /*
      SWAP GUIDE
      현재: <img> 태그를 사용합니다.
      영상으로 교체 시:
        1. <img id="main-media"> 를 <video id="main-media" autoplay loop muted playsinline> 로 교체
        2. JS의 swapMedia() 에서 src → currentSrc 또는 setAttribute('src', ...) 방식 동일하게 사용 가능
        3. CSS는 그대로 적용됩니다.
    */
    .media-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
    }

    #main-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    /* ── Start button ── */
    #start-btn {
      height: 52px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #start-btn:hover  { opacity: 0.88; }
    #start-btn:active { opacity: 0.76; }
    #start-btn:disabled {
      background: var(--border);
      color: var(--text-secondary);
      cursor: default;
      opacity: 1;
    }

    /* ── Webcam preview (bottom-right) ── */
    #webcam-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 120px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      background: #000;
      display: none; /* shown after camera starts */
      z-index: 20;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror */
      display: block;
    }

    /* ── Error message ── */
    #error-msg {
      font-size: 13px;
      color: #e03131;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gesture Interactive</h1>
  </header>

  <main>
    <div class="status-wrap">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Waiting</span>
    </div>

    <!-- Main reactive image. Replace <img> with <video> for mp4 — see SWAP GUIDE above. -->
    <div class="media-card">
      <img
        id="main-media"
        src="default-image.png"
        alt="main visual"
      />
    </div>

    <button id="start-btn">Start Camera</button>
    <p id="error-msg"></p>
  </main>

  <!-- Small webcam preview -->
  <div id="webcam-wrap">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    // ── DOM refs ────────────────────────────────────────────────────────────
    const startBtn      = document.getElementById("start-btn");
    const webcamEl      = document.getElementById("webcam");
    const webcamWrap    = document.getElementById("webcam-wrap");
    const mainMedia     = document.getElementById("main-media");
    const statusDot     = document.getElementById("status-dot");
    const statusText    = document.getElementById("status-text");
    const errorMsg      = document.getElementById("error-msg");

    // ── Asset paths ─────────────────────────────────────────────────────────
    /*
      SWAP GUIDE (images → videos)
      아래 경로를 mp4 파일 경로로 바꾸고,
      index.html의 <img>를 <video autoplay loop muted playsinline>로 교체하세요.
    */
    const ASSETS = {
      default:  "default-image.png",
      thumbUp:  "thumb-up-image.png",
    };

    // ── State ────────────────────────────────────────────────────────────────
    let recognizer = null;
    let animFrameId = null;
    let lastState = "waiting"; // "waiting" | "hand" | "thumb"

    // ── UI helpers ───────────────────────────────────────────────────────────
    function setStatus(state) {
      if (state === lastState) return;
      lastState = state;

      const labels = {
        waiting: "Waiting",
        hand:    "Hand detected",
        thumb:   "Thumb up detected",
      };

      statusText.textContent = labels[state];
      statusDot.className  = "status-dot"  + (state !== "waiting" ? ` ${state}` : "");
      statusText.className = "status-text" + (state !== "waiting" ? ` ${state}` : "");

      // swap the main visual
      const src = state === "thumb" ? ASSETS.thumbUp : ASSETS.default;
      if (mainMedia.src !== src && !mainMedia.src.endsWith(src)) {
        mainMedia.style.opacity = "0";
        setTimeout(() => {
          mainMedia.src = src;
          mainMedia.style.opacity = "1";
        }, 120);
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }

    // ── MediaPipe setup ──────────────────────────────────────────────────────
    async function initRecognizer() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      recognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numHands: 1,
      });
    }

    // ── Detection loop ───────────────────────────────────────────────────────
    function detect() {
      if (!recognizer || webcamEl.readyState < 2) {
        animFrameId = requestAnimationFrame(detect);
        return;
      }

      const result = recognizer.recognizeForVideo(webcamEl, performance.now());

      if (!result.gestures || result.gestures.length === 0) {
        setStatus("waiting");
      } else {
        const topGesture = result.gestures[0][0]?.categoryName ?? "";
        if (topGesture === "Thumb_Up") {
          setStatus("thumb");
        } else {
          setStatus("hand");
        }
      }

      animFrameId = requestAnimationFrame(detect);
    }

    // ── Camera start ─────────────────────────────────────────────────────────
    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Starting...";

      try {
        // 1. init model if not yet loaded
        if (!recognizer) await initRecognizer();

        // 2. request webcam
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 },
        });
        webcamEl.srcObject = stream;
        await webcamEl.play();

        // 3. show preview & start loop
        webcamWrap.style.display = "block";
        startBtn.textContent = "Camera On";
        detect();

      } catch (err) {
        startBtn.disabled = false;
        startBtn.textContent = "Start Camera";
        if (err.name === "NotAllowedError") {
          showError("카메라 권한이 필요합니다. 브라우저 설정에서 허용해 주세요.");
        } else {
          showError("카메라를 시작할 수 없습니다: " + err.message);
        }
      }
    });
  </script>
</body>
</html>
